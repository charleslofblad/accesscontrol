<div class="container passerkort-container">
    <div class="d-flex justify-content-between align-items-center my-4">
    <h1 class="m-0">Passerkort</h1>
    <button class="btn btn-primary" (click)="nyttIdKort()">
      ➕ Lägg till passerkort
    </button>
  </div>

  <!-- 🔍 Sökfält direkt under rubriken -->
 <!-- <div class="input-group mb-3 mx-auto" style="max-width: 600px;">-->

  <div class="input-group mb-3 ms-0" style="max-width: 1280px;">
    <input 
      type="text" 
      class="form-control" 
      placeholder="Sök efter namn, personnummer, Mifare_kod, EM_kod eller RCO" 
      [(ngModel)]="sokTerm"
      (keyup.enter)="sokAnstalld(sokTerm)"
    >
    <button 
      class="btn btn-primary" 
      type="button"
      (click)="sokAnstalld(sokTerm)"
    >
      Sök
    </button>
  </div>

  <!-- 📷 Bildcontainer -->
  <div id="crop-container" class="mb-3">
    <img id="originalImage" class="img-fluid d-none" alt="Original Image">
    <button id="detectFaceButton" class="btn btn-primary d-none">Detektera och beskär ansikte</button>
  </div>

  <!-- 🎴 ID-kort + info-paneler -->
  <div id="id-card-container" *ngIf="valdAnstalld" class="d-flex justify-content-center align-items-start gap-3">
    <!-- Canvas -->
    <div class="canvas-container">
      <canvas
        #idCardCanvas
        id="id-card-canvas"
        width="300"
        height="500">
      </canvas>
    </div>

    <!-- Vänster kolumn -->
    <div id="info-card" class="border p-2">
      <div id="infoFields">
        <div class="mb-3">
          <label for="fornamn" class="form-label">Förnamn</label>
          <input type="text" id="fornamn" class="form-control" [(ngModel)]="valdAnstalld.Fornamn" (input)="markAsChanged()">
        </div>
        <div class="mb-3">
          <label for="efternamn" class="form-label">Efternamn</label>
          <input type="text" id="efternamn" class="form-control" [(ngModel)]="valdAnstalld.Efternamn" (input)="markAsChanged()">
        </div>
        <div class="mb-3">
          <label for="personnummer" class="form-label">Personnummer</label>
          <input type="text" id="personnummer" class="form-control" [(ngModel)]="valdAnstalld.Personnummer" (input)="markAsChanged()">
        </div>
        <div class="mb-3">
          <label for="chef" class="form-label">Chef</label>
          <input type="text" id="chef" class="form-control" [(ngModel)]="valdAnstalld.Chef" (input)="markAsChanged()">
        </div>
        <div class="mb-3">
          <label for="roll" class="form-label">Roll</label>
          <input type="text" id="roll" class="form-control" [(ngModel)]="valdAnstalld.Roll" (input)="markAsChanged()">
 
        </div>
      </div>
    </div>

    <!-- Höger kolumn -->
    <div id="info-card" class="border p-2">
      <div id="infoFields">
        
   
        <div class="mb-3">
          <label for="EMkod" class="form-label">EM_kod</label>
          <input type="text" id="EMkod" class="form-control" [(ngModel)]="valdTjanstekort.EM_kod" (input)="markAsChanged()">
        </div>
        <div class="mb-3">
          <label for="mifareKod" class="form-label">Mifare_kod</label>
          <input type="text" id="mifareKod" class="form-control" [(ngModel)]="valdTjanstekort.Mifare_kod" (input)="markAsChanged()">
        </div>
         <div class="mb-3">
          <label for="alliera_Bla" class="form-label">Alliera Bla</label>
          <input type="text" id="alliera_Bla" class="form-control" [(ngModel)]="valdTjanstekort.Alliera_Bla" (input)="markAsChanged()">
        </div>
         <div class="mb-3">
          <label for="alliera_Gron" class="form-label">Alliera Grön</label>
          <input type="text" id="alliera_Gron" class="form-control" [(ngModel)]="valdTjanstekort.Alliera_Gron" (input)="markAsChanged()">
        </div>
        <div class="mb-3">
          <label for="rco" class="form-label">RCO</label>
          <input type="text" id="rco" class="form-control" [(ngModel)]="valdTjanstekort.RCO" (input)="markAsChanged()">
        </div>
        


        <!-- Kön & Ålder -->
        <div *ngIf="detekteradAlder !== null && detekteratKon">
          <p><strong>Kön:</strong> {{ detekteratKon }}  
             <strong>Ålder:</strong> {{ detekteradAlder }} år</p>
        </div>
      </div>
    </div>
        <!-- Tredje kolumn -->
    <div id="info-card" class="border p-2">
      <div id="infoFields">

        <div class="mb-3">
          <label for="organisation" class="form-label">Organisation</label>
          <select 
            id="organisation" 
            class="form-select" 
            [(ngModel)]="valdAnstalld.Layout" 
            (change)="markAsChanged()">
            <option [ngValue]="'Stockholmståg'">Stockholmståg</option>
            <option [ngValue]="'SJ'">SJ</option>
            <option [ngValue]="'Konsult'">Konsult</option>
            <option [ngValue]="'Götalandståg'">Götalandståg</option>
            <option [ngValue]="'Norlandståg'">Norlandståg</option>
            <option [ngValue]="'Krösa'">Krösa</option>
          </select>
        </div>
       <div class="mb-3">
          <label for="foretag" class="form-label">Företag</label>
          <input type="text" id="foretag" class="form-control" [(ngModel)]="valdAnstalld.Foretag" (input)="markAsChanged()">
        </div>

<!-- Upload-sektion flyttad hit -->
        <div class="mt-3">
          <label for="fileInput" class="form-label">Välj bild:</label>
          <input 
            type="file" 
            id="fileInput" 
            class="form-control" 
            (change)="onFileSelected($event)">
        </div>
        
        <div class="mt-2">
          <button 
            class="btn btn-primary" 
            (click)="onUploadClick()" 
            [disabled]="!valgtBildFile">
            Ladda upp vald bild
          </button>
        </div>
        <button (click)="toggleOriginalBild()">
    {{ visaOriginalBild ? 'Visa beskuren bild' : 'Visa originalbild' }}
  </button>

      </div>
    </div><!-- END - Tredje kolumn -->

  </div>

  <!-- 🔘 Knappgrupp -->
  <div class="button-group mt-3">
    <button class="btn btn-secondary" (click)="back()">Tillbaka</button>
   

    <button class="btn btn-primary" (click)="redigeraLayout()">Redigera Layout</button>
   <button class="btn btn-outline-dark"
(click)="prevAnstalld()"
[disabled]="valdIndex <= 0">
&larr; Föregående
</button>

<button
*ngFor="let page of pageNumbers"
class="btn"
[ngClass]="{
'btn-primary':page===currentPage,
'btn-outline-primary':page!==currentPage
}"
(click)="goToPage(page)">
{{page}}
</button>

<button class="btn btn-outline-dark"
(click)="nextAnstalld()"
[disabled]="valdIndex >= anstallda.length - 1">
Nästa &rarr;
</button>

    <button class="btn btn-outline-dark" (click)="skrivUt()">Skriv ut</button>
    <button class="btn btn-outline-dark" (click)="sparaAnstalld()" [disabled]="!harAndringar">💾 Spara</button>
   <!-- <button class="btn btn-outline-dark" (click)="nextAnstalld()" [disabled]="valdIndex >= anstallda.length - 1">Nästa &rarr;</button>-->
  </div>

  <!--<button (click)="toggleOriginalBild()">
    {{ visaOriginalBild ? 'Visa beskuren bild' : 'Visa originalbild' }}
  </button>-->

<button type="button" class="btn btn-primary">Primary</button>
<button type="button" class="btn btn-secondary">Secondary</button>
<button type="button" class="btn btn-success">Success</button>
<button type="button" class="btn btn-danger">Danger</button>
<button type="button" class="btn btn-warning">Warning</button>
<button type="button" class="btn btn-info">Info</button>
<button type="button" class="btn btn-light">Light</button>
<button type="button" class="btn btn-dark">Dark</button>

<button type="button" class="btn btn-link">Link</button>


</div>

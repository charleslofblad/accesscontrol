
<input type="text" id="searchField" (input)="searchTable($event)" placeholder="Sök..." />
<button (click)="laggTillNyAnstalld()">➕ Lägg till ny anställd</button>

<!-- 🆕 Paginering denna div är ny "pagination-controls" -->
<div class="pagination-controls">
    <button (click)="tillbaka()" [disabled]="skip === 0">⬅️ Föregående</button>
    <button (click)="naxta()">➡️ Nästa</button>    
</div>



<div #handsontableContainer class="handsontable-container"></div>

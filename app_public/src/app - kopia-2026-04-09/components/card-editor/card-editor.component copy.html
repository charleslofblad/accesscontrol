<div class="editor-container">
  <div class="canvas-container">
    <canvas #canvas class="card-canvas"></canvas>
  </div>

  <div class="toolbar">
    <label>Bakgrundsfärg:</label>
    <input type="color" (change)="setBackgroundColor($event)" />
    <button (click)="addText()">Lägg till text</button>
    <button (click)="triggerImageUpload()">Lägg till logotyp</button>
    <input
      type="file"
      id="imageUpload"
      (change)="onImageSelected($event)"
      style="display: none"
    />
    <button (click)="addRectangle()">Lägg till rektangel</button>
    <button (click)="deleteSelected()">Ta bort vald</button>
    <button (click)="clearCanvas()">Rensa</button>
  </div>

  <div class="text-editor">
    <input
      type="text"
      [(ngModel)]="textInput"
      (input)="updateSelectedText()"
      placeholder="Redigera vald text"
    />
    <label>Fontstorlek:</label>
    <input
      type="number"
      [(ngModel)]="fontSize"
      (change)="updateFont()"
      min="8"
      max="72"
    />
    <label>Fontfamilj:</label>
    <select [(ngModel)]="fontFamily" (change)="updateFont()">
      <option>Arial</option>
      <option>Helvetica</option>
      <option>Times New Roman</option>
      <option>Courier New</option>
      <option>Verdana</option>
    </select>
  </div>

  <hr />

  <div class="load-layout">
    <label>Välj sparad layout:</label>
    <select
      [(ngModel)]="selectedLayoutId"
      (ngModelChange)="applyLayout()"
    >
      <option value="">-- Ingen --</option>
      <option *ngFor="let l of layouts" [value]="l._id">{{ l.name }}</option>
    </select>
    <!-- Laddaknappen tas bort, load sker automatiskt -->
    <button
      [disabled]="!selectedLayoutId"
      (click)="saveEditedLayout()"
    >
      Spara ändringar
    </button>
  </div>
  

    <div class="save-layout">
      <label>Nytt layout-namn:</label>
      <input
        type="text"
        [(ngModel)]="newLayoutName"
        placeholder="Ex: Standard"
      />
      <button
        [disabled]="!newLayoutName.trim()"
        (click)="createLayout()"
      >
        Spara
      </button>
    </div>
    

<div class="btn-group">
  <button (click)="backToPasserkort()" class="back-btn">⬅️ Tillbaka till passerkort</button>
</div>


  
</div>

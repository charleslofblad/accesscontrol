<div class="card-detail" *ngIf="person">
  <h2 *ngIf="!editMode">{{ person.Fornamn }} {{ person.Efternamn }}</h2>
  <div *ngIf="editMode" class="form-group">
    <label>Förnamn:</label>
    <input [(ngModel)]="person.Fornamn" />
  </div>

  <div *ngIf="editMode" class="form-group">
    <label>Efternamn:</label>
    <input [(ngModel)]="person.Efternamn" />
  </div>

  <p *ngIf="!editMode"><strong>Personnummer:</strong> {{ person.Personnummer }}</p>
  <div *ngIf="editMode" class="form-group">
    <label>Personnummer:</label>
    <input [(ngModel)]="person.Personnummer" />
  </div>

  <p *ngIf="!editMode"><strong>Roll:</strong> {{ person.Roll }}</p>
  <div *ngIf="editMode" class="form-group">
    <label>Roll:</label>
    <input [(ngModel)]="person.Roll" />
  </div>

  <p *ngIf="!editMode"><strong>Chef:</strong> {{ person.Chef }}</p>
  <div *ngIf="editMode" class="form-group">
    <label>Chef:</label>
    <input [(ngModel)]="person.Chef" />
  </div>

  <!-- ✅ Organisation dropdown -->
  <p *ngIf="!editMode"><strong>Organisation:</strong> {{ person.Layout }}</p>
  <div *ngIf="editMode" class="form-group">
    <label for="organisation" class="form-label">Organisation</label>
    <select 
      id="organisation" 
      class="form-select" 
      [(ngModel)]="person.Layout">
      <option [ngValue]="'Stockholmståg'">Stockholmståg</option>
      <option [ngValue]="'SJ'">SJ</option>
      <option [ngValue]="'Konsult'">Konsult</option>
      <option [ngValue]="'Götalandståg'">Götalandståg</option>
      <option [ngValue]="'Norlandståg'">Norlandståg</option>
      <option [ngValue]="'Krösa'">Krösa</option>
    </select>
  </div>

  <p *ngIf="!editMode"><strong>Företag:</strong> {{ person.Foretag || 'Ej angivet' }}</p>
  <div *ngIf="editMode" class="form-group">
    <label>Företag:</label>
    <input [(ngModel)]="person.Foretag" />
  </div>

  <div *ngIf="person.BildURL">
    <img [src]="person.BildURL" alt="{{ person.FulltNamn }}" class="detail-img" />
  </div>

  <!-- Knappar -->
  <div class="btn-group">
    <button (click)="back()" class="back-btn">Tillbaka</button>
    <button (click)="visaPasserkort()" class="passerkort-btn">Visa passerkort</button>

    <button *ngIf="!editMode" (click)="toggleEdit()" class="edit-btn">Redigera</button>
    <button *ngIf="editMode" (click)="save()" [disabled]="saving" class="save-btn">
      {{ saving ? 'Sparar...' : 'Spara' }}
    </button>
    <button *ngIf="editMode" (click)="toggleEdit()" class="cancel-btn">Avbryt</button>
  </div>
</div>

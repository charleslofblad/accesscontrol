<!-- 🔍 Sökfält -->



<div class="search-bar mb-3">
  <input
    type="text"
    class="form-control"
    placeholder="Sök efter namn, ID eller nummer..."
    [(ngModel)]="searchTerm"
    (keyup.enter)="onSearch()"  
  />
  <button class="btn btn-primary mt-2" (click)="onSearch()">Sök</button>
</div>
<h3 class="m-0">Passerkort översikt</h3>
<!-- Bootstrap Table -->
<div class="table-responsive">
  <table class="table table-striped table-hover align-middle">
    <thead class="table-primary">
      <tr>
        <th>Passerkort</th>
        <th>Förnamn</th>
        <th>Efternamn</th>
        <th>Roll</th>
        <th>Organisation</th>
        <th>Företag</th>
        <th>ID</th>
        <th>Bild</th>
      </tr>
    </thead>
    <tbody>
      <tr 
        *ngFor="let person of anstallda" 
        [class.table-active]="person._id === selectedId"
        (click)="selectPerson(person)"
        style="cursor: pointer"
      >

       
      <td>
          <a
             [routerLink]="['/passerkort', person._id]"
            [queryParams]="{ skip: skip, limit: limit, search: searchTerm }"
          >
           {{ person._id }}
          </a>

        </td>

        <td>
          <a
            [routerLink]="['/card-detail', person._id]"
            [queryParams]="{ skip: skip, limit: limit }"
          >
            {{ person.Fornamn }} 
          </a>
        </td>
         <td>
          <a
            [routerLink]="['/card-detail', person._id]"
            [queryParams]="{ skip: skip, limit: limit }"
          >
            {{ person.Efternamn }}
          </a>
        </td>
        <td>{{ person.Roll }}</td>
        <td>{{ person.Layout }}</td>
        <td>{{ person.Foretag || 'Ej angivet' }}</td>
        <td>{{ person.Anstallda_ID }}</td>
        <td>
          <img 
            *ngIf="person.BildURL" 
            [src]="person.BildURL" 
            alt="{{ person.FulltNamn }}" 
            class="img-thumbnail" 
            style="width: 50px; height: 50px; object-fit: cover;" 
          />
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Bootstrap Pagination -->
<nav aria-label="Page navigation" class="mt-3">
  <ul class="pagination justify-content-center">
    <!-- Föregående -->
    <li class="page-item" [class.disabled]="currentPage === 1">
      <a
        class="page-link"
        (click)="goToPage(currentPage - 1)"
        href="javascript:void(0)"
        >Föregående</a
      >
    </li>

    <!-- Sidnummer -->
    <li
      class="page-item"
      *ngFor="let page of pagesArray()"
      [class.active]="page === currentPage"
    >
      <a
        class="page-link"
        (click)="goToPage(page)"
        href="javascript:void(0)"
        >{{ page }}</a
      >
    </li>

    <!-- Nästa -->
    <li class="page-item" [class.disabled]="currentPage === totalPages">
      <a
        class="page-link"
        (click)="goToPage(currentPage + 1)"
        href="javascript:void(0)"
        >Nästa</a
      >
    </li>
  </ul>
</nav>

<div class="container my-3">
  <!-- Sökfält (server-side sök) -->
  <div class="d-flex gap-2 align-items-start mb-2 search-bar">
    <input
      type="text"
      class="form-control"
      placeholder="Sök efter namn, ID eller nummer..."
      [(ngModel)]="searchTerm"
      (keyup.enter)="onSearch()"
    />
    <div class="d-flex flex-column gap-2">
      <button class="btn btn-primary" (click)="onSearch()">Sök</button>
      <button class="btn btn-outline-secondary" (click)="clearSearch()">Rensa</button>
    </div>

    <!-- Lokalt snabbfilter -->
    <div class="ms-auto d-none d-md-block">
      <input type="text" class="form-control" placeholder="Snabbfilter (lokalt)" (input)="searchTableLocal($event)" />
    </div>
  </div>

  <!-- Åtgärdsknappar -->
  <div class="mb-2 d-flex gap-2">
    <button class="btn btn-success" (click)="laggTillNyAnstalld()">➕ Lägg till ny</button>
    <button class="btn btn-danger" (click)="raderaMarkeradRad()">🗑️ Ta bort markerad</button>
  </div>

  <!-- Handsontable container -->
  <div #handsontableContainer class="handsontable-container hot-table"></div>

  <!-- Pagination -->
  <nav aria-label="Page navigation" class="mt-3">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <a class="page-link" href="javascript:void(0)" (click)="tillbaka()">Föregående</a>
      </li>

      <li
        class="page-item"
        *ngFor="let page of pagesArray()"
        [class.active]="page === currentPage"
      >
        <a class="page-link" href="javascript:void(0)" (click)="goToPage(page)">{{ page }}</a>
      </li>

      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <a class="page-link" href="javascript:void(0)" (click)="nasta()">Nästa</a>
      </li>
    </ul>

    <div class="text-center small text-muted mt-1">
      Visar {{ visningStart }}–{{ visningSlut }} av {{ total }}
    </div>
  </nav>
</div>
